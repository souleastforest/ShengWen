[project]
name = "shengwen"
version = "0.1.1"
description = "ShengWen - Video Transcription & AI Summary Service"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "faster-whisper==1.2.1",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "socksio>=1.0.0",
    "ffmpeg-python==0.2.0",
    "imageio-ffmpeg==0.5.1",
    "litellm==1.81.0",
    "yt-dlp==2025.12.8",
    "bilibili-api-python==17.4.1",
    "httpx>=0.27,<1",
    "aiohttp>=3.9,<4",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "python-multipart==0.0.20",
    "pydantic==2.10.4",
    "sqlalchemy==2.0.36",
    "redis==5.2.1",
    "websockets==14.1",
    "zeroconf==0.131.0",
    "browser-cookie3==0.19.1",
    "anthropic>=0.39.0",
    "loguru>=0.7.0",
    "openai>=1.80.0",
    "torch==2.5.1+cu121",
    "vibevoice",
    "bitsandbytes>=0.50.1",
]

[tool.uv]
dev-dependencies = [
    "basedpyright>=1.39.9",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.9",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
vibevoice = { path = "../VibeVoice-bilibili-subtitle/VibeVoice" }

[tool.pytest.ini_options]
pythonpath = ["."]
